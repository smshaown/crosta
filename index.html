<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crosta — pies baked at six, gone by noon</title>
  <meta
    name="description"
    content="Crosta artisan pie bakery. Four seasonal flavours baked at six, gone by noon — Strawberry, Blueberry, Lemon, and Chocolate."
  />
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='16' fill='%23e0182d'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='%23fff3ea' font-family='Georgia,serif' font-style='italic' font-size='18'>C</text></svg>"
  />

  <!-- Google Fonts: Fraunces & DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Fraunces:ital,opsz,SOFT,wght@0,9..144,100,400..900;1,9..144,100,400..900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./styles/crosta.css" />
</head>
<body>
  <main>
    <div class="cr-track" id="crTrack" style="--stops: 3">
      <section
        class="crosta is-ready"
        id="crostaRoot"
        style="--ink: #fff3ea; --paper: #e0182d"
        aria-label="Crosta seasonal pies"
      >
        <!-- Radial Flood Background Layers -->
        <div class="cr-flood cr-flood-base" id="floodBase"></div>
        <div class="cr-flood cr-flood-in" id="floodIn"></div>
        <div class="cr-grain" aria-hidden="true"></div>

        <!-- Header -->
        <header class="cr-head">
          <a href="#top" class="cr-logo">
            Crosta <span>Baked at six, gone by noon</span>
          </a>

          <nav class="cr-nav" aria-label="Main">
            <a href="#pies">Pies</a>
            <a href="#bakery">The bakery</a>
            <a href="#deliveries">Deliveries</a>
            <a href="#journal">Journal</a>
          </nav>

          <button
            type="button"
            class="cr-box"
            id="boxTrigger"
            aria-label="Your box, 0 items"
            aria-haspopup="dialog"
            aria-expanded="false"
          >
            Your box <b id="boxCount">0</b>
          </button>
        </header>

        <!-- Giant Split-Letter Words -->
        <div class="cr-words" id="crWords" aria-hidden="true"></div>

        <!-- Scattered Depth-Blurred Toppings -->
        <div class="cr-scatter" id="crScatter" aria-hidden="true"></div>

        <!-- Center Pie Stage -->
        <div class="cr-pies" id="crPies" tabindex="0" aria-label="Drag or scroll to spin the pie">
          <div class="cr-shadow" id="crShadow"></div>
        </div>

        <!-- Curved Radial Dial -->
        <div class="cr-dial">
          <div class="cr-ticks" aria-hidden="true"><i id="crTicksRing"></i></div>
          <div class="cr-pin" aria-hidden="true"></div>
          <div class="cr-ring" id="crRing" role="tablist" aria-label="Flavours"></div>
        </div>

        <!-- Bottom-Left Pie Info -->
        <div class="cr-info" id="crInfo">
          <p class="cr-count">
            <b id="pieNum">01</b>
            <i>/ 04</i>
            <em id="pieTitle">Strawberry pie</em>
          </p>
          <p class="cr-line" id="pieDesc"></p>
          <ul class="cr-notes" id="pieTags"></ul>
        </div>

        <!-- Bottom-Right Size Toggle, Price & Add CTA -->
        <div class="cr-buy">
          <div class="cr-sizes" id="crSizes" role="radiogroup" aria-label="Size">
            <span class="cr-thumb" aria-hidden="true"></span>
            <button type="button" class="is-on" role="radio" aria-checked="true" data-size="whole">
              Whole pie
            </button>
            <button type="button" role="radio" aria-checked="false" data-size="slice">
              One slice
            </button>
          </div>

          <p class="cr-price" id="crPriceWrap">
            <b id="piePrice">&euro;42</b>
            <span id="pieServes">serves eight</span>
          </p>

          <button type="button" class="cr-add" id="addToBoxBtn">
            <span>Add to box</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14"></path>
              <path d="m12 5 7 7-7 7"></path>
            </svg>
          </button>
        </div>

        <!-- Scroll Hint -->
        <p class="cr-hint" aria-hidden="true">
          <i></i> Scroll for the next pie
        </p>

        <!-- Box Slide-Over Drawer -->
        <aside
          class="cr-drawer"
          id="boxDrawer"
          role="dialog"
          aria-modal="true"
          aria-hidden="true"
          aria-label="Your pie box"
        >
          <button type="button" class="cr-drawer-close" id="closeBoxBtn" aria-label="Close box">&times;</button>
          <p class="cr-drawer-eyebrow">Your box</p>
          <h2 class="cr-drawer-title">Baked at six</h2>

          <div class="cr-drawer-empty" id="boxEmpty">
            <p>Your box is empty</p>
            <span>Choose a whole pie or a slice from the four flavours.</span>
          </div>

          <ul class="cr-drawer-items" id="boxItems"></ul>

          <div class="cr-drawer-foot" id="boxFoot" hidden>
            <div>
              <span>Total</span>
              <b id="boxTotal">&euro;0</b>
            </div>
            <button type="button" class="cr-add" id="checkoutBtn">
              <span>Order for morning</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14"></path>
                <path d="m12 5 7 7-7 7"></path>
              </svg>
            </button>
          </div>
        </aside>
      </section>
    </div>
  </main>

  <div class="cr-sr" id="srAnnouncer" aria-live="polite"></div>

  <!-- GSAP 3.12.5 + ScrollTrigger -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="./js/pies-data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
